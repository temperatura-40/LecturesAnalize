[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lectures-notes"
version = "0.1.0"
description = "Pipeline for processing lecture audio into Markdown notes"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[project.scripts]
lectures = "src.cli:main"
